<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingston SOC — offline</title>
<style>
  :root { --teal: #17708c; --ink: #1d1f20; --muted: #5d5d60; --page: #f8f8f9; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; border-top: 4px solid var(--teal); background: #fff; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: .02em; text-transform: uppercase; }
  p { margin: 8px 0; color: var(--muted); }
  code { background: #eaf5f8; padding: 2px 6px; }
</style>
</head>
<body>
<main>
  <h1>Kingston SOC is switched off</h1>
  <p>This MVP only runs while it is being used, to keep cloud costs at zero.</p>
  <p>Work already captured on your phone is safe on the device and uploads automatically when the service is back.</p>
  <p>Administrator: start it with <code>.\infra\soc.ps1 up</code></p>
</main>
</body>
</html>
